<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>外傷と骨性癒着 · 矯正歯科医のバイブル</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;800&family=Noto+Serif+JP:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F1F7FC;--paper:#FFFFFF;--ink:#122A45;--ink-soft:#4E627A;--accent:#1683CE;--accent-dark:#0F3157;--line:#CBE6F8}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:'Noto Sans JP','Hiragino Sans',sans-serif;line-height:1.55;-webkit-font-smoothing:antialiased}
.top{background:var(--accent-dark);color:var(--paper);text-align:center;padding:11px 16px;font-family:'Noto Serif JP',serif;font-weight:700;font-size:15px}
.wrap{max-width:960px;margin:0 auto;padding:28px 16px 56px}
.head{text-align:center;margin-bottom:22px}
.kicker{display:inline-block;background:var(--accent);color:var(--paper);padding:6px 14px;border-radius:99px;font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;margin-bottom:12px}
h1{font-family:'Noto Serif JP',serif;font-size:clamp(26px,5vw,40px);line-height:1.15;margin-bottom:10px}
.sub{color:var(--ink-soft);font-size:17px;max-width:640px;margin:0 auto 20px}
.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:12px 22px;border-radius:12px;font-weight:800;font-size:16px;text-decoration:none;border:2px solid transparent}
.btn.primary{background:var(--accent);color:var(--paper);box-shadow:0 4px 0 var(--accent-dark)}
.btn.ghost{color:var(--accent-dark);border-color:var(--line);background:var(--paper)}
.viewer{margin-top:22px;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:#000}
.viewer iframe{display:block;width:100%;height:75vh;min-height:520px;border:0}
.meta{margin-top:14px;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px 18px;display:flex;gap:18px;flex-wrap:wrap;color:var(--ink-soft);font-size:14px}
.meta b{color:var(--ink)}
.foot{text-align:center;color:var(--ink-soft);font-size:13px;margin-top:28px}
@media (max-width:600px){.btn{width:100%}.viewer iframe{height:70vh}}
</style>
</head>
<body>
<div class="top">矯正歯科医のバイブル</div>
<main class="wrap">
  <div class="head">
    <span class="kicker">ガイド 4 / 5</span>
    <h1>外傷と骨性癒着</h1>
    <p class="sub">外傷歯・骨性癒着歯の矯正的評価と判断。</p>
    <div class="actions">
      <a class="btn primary" href="trauma-ankylosis.pdf" download>PDFをダウンロード</a>
      <a class="btn ghost" href="trauma-ankylosis.pdf" target="_blank" rel="noopener">新しいタブで開く</a>
    </div>
  </div>
  <div class="viewer">
    <iframe src="trauma-ankylosis.pdf#view=FitH" title="外傷と骨性癒着"></iframe>
  </div>
  <div class="meta">
    <div><b>15</b> ページ</div>
    <div>無期限アクセス</div>
  </div>
  <p class="foot">個人および診療での利用に限ります。転売・再配布はご遠慮ください。</p>
</main>
</body>
</html>
